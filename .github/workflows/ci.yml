name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sunnypanel_ci
          POSTGRES_PASSWORD: sunnypanel_ci
          POSTGRES_USER: sunnypanel_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      AGENT_DISABLE_LLM: "1"
      CI: "true"
      DATABASE_URL: postgres://sunnypanel_ci:sunnypanel_ci@localhost:5432/sunnypanel_ci
      NEXT_TELEMETRY_DISABLED: "1"
      PAYLOAD_DB_PUSH: "false"
      PAYLOAD_SECRET: sunnypanel-ci-secret-2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Deterministic tests
        run: env -u DATABASE_URL -u AGENT_DEBUG_LOG npm test

      - name: Payload migrations
        run: npm run migrate

      - name: Verify migration state
        run: npm run verify:migrations

      - name: LangGraph checkpoint integration
        run: npm run test:agent:checkpoint

      - name: Build
        run: npm run build

      - name: Build production container
        run: docker build --target production -t sunnypanel:ci .

      - name: Start production container
        run: >-
          docker run --detach
          --name sunnypanel-ci-runtime
          --network host
          --env AGENT_DISABLE_LLM
          --env DATABASE_URL
          --env NEXT_PUBLIC_SERVER_URL=http://127.0.0.1:3000
          --env PAYLOAD_DB_PUSH
          --env PAYLOAD_SECRET
          sunnypanel:ci

      - name: Verify production readiness
        run: npm run smoke:release-health

      - name: Show production logs on failure
        if: failure()
        run: docker logs sunnypanel-ci-runtime

      - name: Stop production container
        if: always()
        run: docker rm --force sunnypanel-ci-runtime
