name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sunnypanel_ci
          POSTGRES_PASSWORD: sunnypanel_ci
          POSTGRES_USER: sunnypanel_ci
        options: >-
          --health-cmd "pg_isready -U sunnypanel_ci -d sunnypanel_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      AGENT_DISABLE_LLM: "1"
      CI: "true"
      DATABASE_URL: postgres://sunnypanel_ci:sunnypanel_ci@localhost:5432/sunnypanel_ci
      NEXT_TELEMETRY_DISABLED: "1"
      PAYLOAD_DB_PUSH: "false"
      PAYLOAD_SECRET: sunnypanel-ci-secret-2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Deterministic tests
        run: env -u DATABASE_URL -u AGENT_DEBUG_LOG npm test

      - name: Payload migrations
        run: npm run migrate

      - name: Verify migration state
        run: npm run verify:migrations

      - name: LangGraph checkpoint integration
        run: npm run test:agent:checkpoint

      - name: Previous-release database upgrade
        env:
          UPGRADE_TEST_DATABASE_URL: postgres://sunnypanel_ci:sunnypanel_ci@localhost:5432/sunnypanel_upgrade_ci
        run: npm run test:migrations:upgrade

      - name: Seed disposable release database twice
        env:
          SEED_ADMIN_EMAIL: release-ci@sunnypanel.local
          SEED_ADMIN_PASSWORD: SunnyPanelReleaseCI-2026
        run: |
          npm run seed
          npm run seed

      - name: Build
        run: npm run build

      - name: Build production container
        run: docker build --target production -t sunnypanel:ci .

      - name: Install release browser
        run: npx playwright install --with-deps chromium

      - name: Start deterministic Agent provider
        env:
          AGENT_E2E_FAKE_PROVIDER: "1"
          AGENT_E2E_FAKE_PROVIDER_TOKEN: sunnypanel-ci-fake-provider
        run: |
          npm run agent:e2e-provider > /tmp/sunnypanel-agent-e2e-provider.log 2>&1 &
          echo $! > /tmp/sunnypanel-agent-e2e-provider.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4010/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sunnypanel-agent-e2e-provider.log
          exit 1

      - name: Start production container
        run: >-
          docker run --detach
          --name sunnypanel-ci-runtime
          --network host
          --env AGENT_DISABLE_LLM=0
          --env DATABASE_URL
          --env DEEPSEEK_API_KEY=sunnypanel-ci-fake-provider
          --env DEEPSEEK_API_PROTOCOL=chat_completions
          --env DEEPSEEK_BASE_URL=http://127.0.0.1:4010/v1
          --env DEEPSEEK_MODEL=sunnypanel-ci-fake-model
          --env NEXT_PUBLIC_SERVER_URL=http://127.0.0.1:3000
          --env PAYLOAD_DB_PUSH
          --env PAYLOAD_SECRET
          sunnypanel:ci

      - name: Verify production readiness
        run: npm run smoke:release-health

      - name: Verify production Agent API
        env:
          AGENT_E2E_EMAIL: release-ci@sunnypanel.local
          AGENT_E2E_PASSWORD: SunnyPanelReleaseCI-2026
          AGENT_E2E_SERVER_URL: http://127.0.0.1:3000
        run: npm run test:agent:e2e

      - name: Verify production Agent smoke
        env:
          AGENT_SMOKE_EMAIL: release-ci@sunnypanel.local
          AGENT_SMOKE_PASSWORD: SunnyPanelReleaseCI-2026
          AGENT_SMOKE_SERVER_URL: http://127.0.0.1:3000
        run: npm run smoke:agent

      - name: Verify production browser flows
        env:
          AGENT_E2E_EMAIL: release-ci@sunnypanel.local
          AGENT_E2E_PASSWORD: SunnyPanelReleaseCI-2026
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
        run: npm run test:e2e:release

      - name: Show production logs on failure
        if: failure()
        run: |
          if docker inspect sunnypanel-ci-runtime >/dev/null 2>&1; then
            docker logs sunnypanel-ci-runtime
          fi
          if [ -f /tmp/sunnypanel-agent-e2e-provider.log ]; then
            cat /tmp/sunnypanel-agent-e2e-provider.log
          fi

      - name: Stop production container
        if: always()
        run: docker rm --force sunnypanel-ci-runtime 2>/dev/null || true

      - name: Stop deterministic Agent provider
        if: always()
        run: |
          if [ -f /tmp/sunnypanel-agent-e2e-provider.pid ]; then
            kill "$(cat /tmp/sunnypanel-agent-e2e-provider.pid)" 2>/dev/null || true
          fi
