name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sunnypanel_ci
          POSTGRES_PASSWORD: sunnypanel_ci
          POSTGRES_USER: sunnypanel_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      AGENT_DISABLE_LLM: "1"
      CI: "true"
      DATABASE_URL: postgres://sunnypanel_ci:sunnypanel_ci@localhost:5432/sunnypanel_ci
      NEXT_TELEMETRY_DISABLED: "1"
      PAYLOAD_DB_PUSH: "false"
      PAYLOAD_SECRET: sunnypanel-ci-secret-2026
      TSX_TSCONFIG_PATH: tsconfig.agent-test.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Agent tests
        run: npm run test:agent

      - name: Planning tests
        run: npm run test:agent:planning

      - name: Schedule tests
        run: npm run test:agent:schedule

      - name: Payload migrations
        run: npm run migrate

      - name: Build
        run: npm run build
